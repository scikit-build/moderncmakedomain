[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphinxcontrib-moderncmakedomain"
description = "Sphinx Domain for Modern CMake"
readme = "README.md"
keywords = [
  "cmake",
  "documentation",
  "kitware",
  "sphinx",
  "sphinxcontrib",
]
license = "BSD-3-Clause"
license-files = ["LICENSE.rst"]
authors = [
  { name = "Kitware" },
]
requires-python = ">=3.10"
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: Sphinx :: Domain",
  "Framework :: Sphinx :: Extension",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Documentation",
  "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
  "sphinx>=2",
]

[project.optional-dependencies]
test = [
  "defusedxml",
  "pytest",
]

[project.urls]
Homepage = "https://github.com/scikit-build/moderncmakedomain"


[tool.hatch]
version.path = "sphinxcontrib/moderncmakedomain/__init__.py"
build.targets.wheel.packages = ["sphinxcontrib"]


[tool.uv]
exclude-newer = "7 days"


[tool.ruff]
exclude = [
  "sphinxcontrib/moderncmakedomain/cmake.py",
  "sphinxcontrib/moderncmakedomain/colors.py",
]
lint.extend-select = [
  "B",   # flake8-bugbear
  "RUF", # Ruff-specific
  "I",   # isort
  "UP",  # pyupgrade
]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--showlocals",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:sphinx.builders.gettext",
]
log_level = "INFO"
testpaths = ["tests"]
